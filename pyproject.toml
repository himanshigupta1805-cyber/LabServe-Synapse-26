[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labserve"
version = "1.0.0"
description = "LabServe — Synthetic Fabrication Planner | MCP + LangGraph autonomous AI agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["agent", "mcp_server", "data"]

[project.scripts]
labserve = "main:main"
